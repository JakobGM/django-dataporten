[pytest]
DJANGO_SETTINGS_MODULE = dataporten.settings
python_files = tests.py test_*.py *_tests.py
addopts = --reuse-db

[tox]
envlist =
    py{311,312,313,314}-django52
    py{312,313,314}-django60

[testenv]
extras = test
deps =
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
commands =
    pytest {posargs}
