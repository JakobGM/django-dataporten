[pytest]
DJANGO_SETTINGS_MODULE = dataporten.settings
python_files = tests.py test_*.py *_tests.py
addopts = --reuse-db

[tox]
envlist = py{311,312,313,314}-django{42,50,51,51}

[testenv]
# install pytest in the virtualenv where commands will be executed
deps =
    pytest
    django42: Django>=4.2
    django50: Django>=5.0
    django51: Django>=5.1
    django52: Django>=5.2
commands =
    python setup.py install
    pytest .
